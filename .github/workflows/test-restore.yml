name: Test Restore on Ubuntu 16

on:
  push:
    branches: [debug, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p test-cache
          echo "test content" > test-cache/file.txt

      - uses: actions/cache@v6
        with:
          path: test-cache
          key: test-cache-${{ github.sha }}

  restore:
    needs: save
    runs-on: ubuntu-latest
    container:
      image: ubuntu:16.04
      volumes:
        - /node20_217:/node20_217:rw,rshared
        - /node24_217:/node24_217:rw,rshared
        - /node20_217:/__e/node20:ro,rshared
        - /node24_217:/__e/node24:ro,rshared

    steps:
      - name: Setup environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::Retries=5 update > /dev/null
          apt-get -o Acquire::Retries=5 -y -q --no-install-recommends install curl xz-utils ca-certificates zstd > /dev/null
          curl -sSL https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz | tar -xz --strip-components=1
          curl -sL https://archives.boost.io/misc/node/node-v20.9.0-linux-x64-glibc-217.tar.xz | tar -xJ --strip-components 1 -C /node20_217
          curl -sL https://archives.boost.io/misc/node/node-v24.15.0-linux-x64-glibc-217.tar.xz | tar -xJ --strip-components 1 -C /node24_217
          echo "=== System ==="
          uname -r && ldd --version | head -1
          echo "=== Node 24 ===" && /node24_217/bin/node --version
          echo "=== Node 20 ===" && /node20_217/bin/node --version

      - name: Restore cache (Node 24, expected crash)
        uses: ./
        with:
          path: test-cache
          key: test-cache-no-match-${{ github.sha }}
          restore-keys: test-cache-

      - name: Azure SDK reproduction (import bundle then https.request)
        if: always()
        run: |
          cat > /tmp/test-bundle.mjs << 'SCRIPT'
          // Dynamically import the action bundle to load all 95K lines of
          // Azure SDK + dependencies, then do a simple https.request
          console.error('[TEST] importing bundle...');
          await import('./dist/restore/index.js').catch(() => {
            console.error('[TEST] import threw (expected - no GHA env), continuing');
          });
          console.error('[TEST] bundle imported, now doing https.request');
          const { createRequire } = await import('module');
          const require = createRequire(import.meta.url);
          const https = require('node:https');
          const agent = new https.Agent({ keepAlive: true });
          const req = https.request({
            agent, hostname: 'productionresultssa0.blob.core.windows.net',
            path: '/actions-cache/test', port: '', method: 'HEAD',
            headers: { 'x-ms-version': '2025-11-05' },
          }, (res) => {
            console.error('[TEST] response:', res.statusCode);
            process.exit(0);
          });
          req.on('socket', (s) => {
            console.error('[TEST] socket assigned');
            s.on('lookup', (e,a) => console.error('[TEST] DNS:', a));
            s.on('connect', () => console.error('[TEST] TCP connected'));
            s.on('secureConnect', () => console.error('[TEST] TLS done'));
          });
          req.on('error', (e) => { console.error('[TEST] error:', e.message); process.exit(1); });
          req.end();
          SCRIPT
          echo "=== Node 24: import bundle then https.request ==="
          cd /__w/cache/cache && /node24_217/bin/node /tmp/test-bundle.mjs 2>&1 || echo "EXIT CODE: $?"

      - name: Azure SDK reproduction (require @azure/storage-blob)
        if: always()
        run: |
          cat > /tmp/test-azsdk.mjs << 'SCRIPT'
          // Use the Azure SDK directly from the bundled node_modules
          console.error('[TEST] importing @azure/storage-blob...');
          const { BlockBlobClient } = await import('@azure/storage-blob');
          console.error('[TEST] imported, creating BlockBlobClient...');
          const client = new BlockBlobClient(
            'https://productionresultssa0.blob.core.windows.net/actions-cache/test'
          );
          console.error('[TEST] calling getProperties...');
          const props = await client.getProperties();
          console.error('[TEST] getProperties succeeded:', props.contentLength);
          process.exit(0);
          SCRIPT
          echo "=== Node 24: @azure/storage-blob getProperties ==="
          cd /__w/cache/cache && /node24_217/bin/node --input-type=module /tmp/test-azsdk.mjs 2>&1 || echo "EXIT CODE: $?"
          echo ""
          echo "=== Node 20: @azure/storage-blob getProperties (control) ==="
          cd /__w/cache/cache && /node20_217/bin/node --input-type=module /tmp/test-azsdk.mjs 2>&1 || echo "EXIT CODE: $?"
