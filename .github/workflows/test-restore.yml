name: Test Restore on Ubuntu 16

on:
  push:
    branches: [debug, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p test-cache
          echo "test content" > test-cache/file.txt

      - uses: actions/cache@v6
        with:
          path: test-cache
          key: test-cache-${{ github.sha }}

  restore:
    needs: save
    runs-on: ubuntu-latest
    container:
      image: ubuntu:16.04
      options: --cap-add=SYS_PTRACE --security-opt=seccomp=unconfined
      volumes:
        - /node20_217:/node20_217:rw,rshared
        - /node24_217:/node24_217:rw,rshared
        - /node20_217:/__e/node20:ro,rshared
        - /node24_217:/__e/node24:ro,rshared

    steps:
      - name: Setup environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::Retries=5 update > /dev/null
          apt-get -o Acquire::Retries=5 -y -q --no-install-recommends install curl xz-utils ca-certificates zstd software-properties-common > /dev/null
          # Install GDB 9+ from Ubuntu 20.04 (focal) — Ubuntu 16.04's GDB 7.11
          # doesn't support DWARF 5 which Node 24's binary uses.
          add-apt-repository -y "deb http://archive.ubuntu.com/ubuntu focal main"
          apt-get -o Acquire::Retries=5 update > /dev/null
          apt-get -o Acquire::Retries=5 -y -q --no-install-recommends install gdb > /dev/null
          echo "=== GDB version ===" && gdb --version | head -1
          curl -sSL https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz | tar -xz --strip-components=1
          curl -sL https://archives.boost.io/misc/node/node-v24.15.0-linux-x64-glibc-217.tar.xz | tar -xJ --strip-components 1 -C /node24_217
          echo "=== System ===" && uname -r && ldd --version | head -1
          echo "=== Node 24 ===" && /node24_217/bin/node --version
          # Create GDB wrapper. GDB catches SIGSEGV before the process dies,
          # prints backtrace to /tmp/gdb.log (not stdout, to avoid corrupting
          # the GHA action protocol).
          mv /node24_217/bin/node /node24_217/bin/node-real
          cat > /node24_217/bin/node << 'WRAPPER'
          #!/bin/bash
          exec gdb -batch \
            -ex "set pagination off" \
            -ex "handle SIGSEGV stop nopass" \
            -ex "run" \
            -ex "echo === BACKTRACE (crashing thread) ===\n" \
            -ex "bt" \
            -ex "echo === ALL THREADS ===\n" \
            -ex "thread apply all bt full" \
            -ex "echo === INFO REGISTERS ===\n" \
            -ex "info registers" \
            -ex "echo === INFO SHARED LIBRARIES ===\n" \
            -ex "info sharedlibrary" \
            --args "$(dirname "$0")/node-real" "$@" 2>&1
          WRAPPER
          chmod +x /node24_217/bin/node
          echo "=== Wrapper created with GDB ==="
          /__e/node24/bin/node --version

      - name: Restore cache (Node 24, under GDB)
        uses: ./
        with:
          path: test-cache
          key: test-cache-no-match-${{ github.sha }}
          restore-keys: test-cache-
