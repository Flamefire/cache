name: Test Restore on Ubuntu 16

on:
  push:
    branches: [debug, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p test-cache
          echo "test content" > test-cache/file.txt

      - uses: actions/cache@v6
        with:
          path: test-cache
          key: test-cache-${{ github.sha }}

  restore:
    needs: save
    runs-on: ubuntu-latest
    container:
      image: ubuntu:16.04
      options: --cap-add=SYS_PTRACE --security-opt=seccomp=unconfined
      volumes:
        - /node20_217:/node20_217:rw,rshared
        - /node24_217:/node24_217:rw,rshared
        - /node20_217:/__e/node20:ro,rshared
        - /node24_217:/__e/node24:ro,rshared

    steps:
      - name: Setup environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::Retries=5 update > /dev/null
          apt-get -o Acquire::Retries=5 -y -q --no-install-recommends install curl xz-utils ca-certificates zstd strace gdb > /dev/null
          curl -sSL https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz | tar -xz --strip-components=1
          curl -sL https://archives.boost.io/misc/node/node-v24.15.0-linux-x64-glibc-217.tar.xz | tar -xJ --strip-components 1 -C /node24_217
          echo "=== System ==="
          uname -r && ldd --version | head -1
          echo "=== Node 24 ===" && /node24_217/bin/node --version
          # Create wrapper that runs node under strace to capture syscalls
          # strace -f traces all threads (including libuv thread pool)
          # The crash happens in a background thread, so -f is essential
          mv /node24_217/bin/node /node24_217/bin/node-real
          printf '#!/bin/bash\nexec strace -f -o /tmp/strace.log "$(dirname "$0")/node-real" "$@"\n' > /node24_217/bin/node
          chmod +x /node24_217/bin/node
          echo "=== Wrapper created with strace ==="
          /__e/node24/bin/node --version

      - name: Restore cache (Node 24, under strace)
        uses: ./
        with:
          path: test-cache
          key: test-cache-no-match-${{ github.sha }}
          restore-keys: test-cache-

      - name: Collect strace output
        if: always()
        run: |
          echo "=== Strace log size ==="
          wc -l /tmp/strace.log 2>/dev/null || echo "No strace log"
          echo ""
          echo "=== Last 200 lines of strace (crash point) ==="
          tail -200 /tmp/strace.log 2>/dev/null || echo "Cannot read strace log"
          echo ""
          echo "=== Signals in strace ==="
          grep -i 'SIGSEGV\|SIGABRT\|SIGBUS\|SIGILL\|--- Signal\|killed by' /tmp/strace.log 2>/dev/null || echo "No signals found in strace"
          echo ""
          echo "=== getaddrinfo/dns related ==="
          grep -i 'getaddrinfo\|recvfrom\|sendto.*53\|connect.*53' /tmp/strace.log 2>/dev/null | tail -20 || echo "No DNS syscalls found"
