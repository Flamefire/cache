name: Test Restore on Ubuntu 16

on:
  push:
    branches: [debug, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p test-cache
          echo "test content" > test-cache/file.txt

      - uses: actions/cache@v6
        with:
          path: test-cache
          key: test-cache-${{ github.sha }}

  restore:
    needs: save
    runs-on: ubuntu-latest
    container:
      image: ubuntu:16.04
      volumes:
        - /node24_217:/node24_217:rw,rshared
        - /node24_217:/__e/node24:ro,rshared

    strategy:
      fail-fast: false
      matrix:
        node-flags: ["", "--no-maglev"]

    steps:
      - name: Setup environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::Retries=5 update > /dev/null
          apt-get -o Acquire::Retries=5 -y -q --no-install-recommends install curl xz-utils ca-certificates zstd > /dev/null
          # Download repo tarball (avoids needing git 2.18+ for actions/checkout)
          curl -sSL https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz | tar -xz --strip-components=1
          # Install Node 24 (glibc 2.17 build for Ubuntu 16)
          curl -sL https://archives.boost.io/misc/node/node-v24.15.0-linux-x64-glibc-217.tar.xz | tar -xJ --strip-components 1 -C /node24_217
          /node24_217/bin/node --version
          /node24_217/bin/node -p "process.versions"
          # Create wrapper script so the runner spawns node with our flags.
          # /node24_217 is writable, bind-mounted to /__e/node24 (read-only).
          # Changes to source are visible through the bind mount.
          mv /node24_217/bin/node /node24_217/bin/node-real
          printf '#!/bin/bash\necho "Executing node with flags: ${{ matrix.node-flags }}" && exec "$(dirname "$0")/node-real" ${{ matrix.node-flags }} "$@"\n' > /node24_217/bin/node
          chmod +x /node24_217/bin/node
          echo "=== Wrapper created, flags: '${{ matrix.node-flags }}' ==="
          /__e/node24/bin/node --version

      - name: Restore cache
        uses: ./
        with:
          path: test-cache
          key: test-cache-no-match-${{ github.sha }}
          restore-keys: test-cache-
